workflows:
  android-apk-workflow:
    name: Voxora Quran Class - Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "com.aistudio.voxoraquran.app"
      java: 17
    scripts:
      - name: Set up Android SDK environment
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Set up Keystore and Signing
        script: |
          # If Codemagic UI Keystore environment variables exist, decode them
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/release.keystore"
            export KEYSTORE_PATH="$CM_BUILD_DIR/release.keystore"
            export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
            export KEY_ALIAS="$CM_KEY_ALIAS"
            export KEY_PASSWORD="$CM_KEY_PASSWORD"
          elif [ -f "$CM_BUILD_DIR/debug.keystore.base64" ] && [ ! -f "$CM_BUILD_DIR/debug.keystore" ]; then
            echo "Restoring testing keystore from base64..."
            base64 -d "$CM_BUILD_DIR/debug.keystore.base64" > "$CM_BUILD_DIR/debug.keystore" 2>/dev/null || \
            base64 -D "$CM_BUILD_DIR/debug.keystore.base64" > "$CM_BUILD_DIR/debug.keystore" 2>/dev/null || \
            openssl base64 -d -in "$CM_BUILD_DIR/debug.keystore.base64" -out "$CM_BUILD_DIR/debug.keystore"
          fi

          # Ensure a valid testing keystore exists so release build is signed and installable
          if [ ! -f "$CM_BUILD_DIR/debug.keystore" ] && [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating test signing keystore..."
            keytool -genkey -v -keystore "$CM_BUILD_DIR/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Verify and prepare Gradle Wrapper
        script: |
          chmod +x gradlew
          if ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Gradle wrapper JAR is invalid or corrupted. Restoring Gradle wrapper..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar || \
            gradle wrapper --gradle-version 9.3.1
            chmod +x gradlew
          fi
          ./gradlew --version
      - name: Build Signed Release APK
        script: |
          ./gradlew :app:assembleRelease --stacktrace
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - cipmore67@gmail.com
        notify:
          success: true
          failure: true
